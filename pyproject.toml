[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
# Default pyflakes + pycodestyle error rules: catches unused imports/variables,
# undefined names, and syntax-level issues without demanding a full reformat.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# app.py must monkeypatch signal.signal and set CREWAI_TELEMETRY_OPT_OUT before
# importing meeting_assistant (which imports crewai), so these imports are
# intentionally not at the top of the file.
"app.py" = ["E402"]
